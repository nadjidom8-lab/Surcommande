<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#8a5c2e" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Qandoura" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="icon" href="icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet" />
  <title>إدارة الطلبيات</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root {
      height: 100%;
      font-family: 'Amiri', serif;
      direction: rtl;
      background: #f5f0e8;
      -webkit-tap-highlight-color: transparent;
      -webkit-font-smoothing: antialiased;
    }
    select option { background: #fdf8f1; color: #3a2e22; }
    @keyframes ripple {
      0%   { transform: scale(0); opacity: 1; }
      100% { transform: scale(2.5); opacity: 0; }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(192,69,58,.4); }
      50%       { box-shadow: 0 0 0 8px rgba(192,69,58,0); }
    }
    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .urgRed { animation: pulse 2s infinite; }
    tr:hover td { background: rgba(180,130,60,.04) !important; }
    #loading {
      position: fixed; inset: 0; background: #f5f0e8;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Amiri', serif; font-size: 18px; color: #8a5c2e;
      flex-direction: column; gap: 16px;
    }
    #loading .spinner {
      width: 40px; height: 40px;
      border: 3px solid #e2d9c8;
      border-top-color: #8a5c2e;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="root">
    <div id="loading">
      <div class="spinner"></div>
      <span>جاري التحميل...</span>
    </div>
  </div>

  <!-- React 18 UMD -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Babel standalone to compile JSX in browser -->
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>

  <!-- The full app (JSX) -->
  <script type="text/babel" src="app.jsx"></script>

  <!-- Service Worker for offline + PWA -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(() => console.log('SW registered'))
          .catch(() => {});
      });
    }
  </script>
</body>
</html>
